<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blue3 · Acompanhamento Cássia</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;--surface:#ffffff;--border:#e2e8f0;--border2:#cbd5e1;
  --text:#0f172a;--muted:#64748b;--muted2:#94a3b8;
  --blue:#1d4ed8;--blue-light:#eff6ff;--blue-mid:#dbeafe;
  --green:#16a34a;--green-bg:#dcfce7;
  --yellow:#ca8a04;--yellow-bg:#fef9c3;
  --orange:#ea580c;--orange-bg:#ffedd5;
  --red:#dc2626;--red-bg:#fee2e2;
  --mono:'DM Mono',monospace;
  --sans:'Inter',sans-serif;
  --radius:8px;--radius-lg:12px;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}

/* ── Top bar ── */
.topbar{background:#0f172a;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-brand{display:flex;align-items:center;gap:12px}
.topbar-logo{width:32px;height:32px;background:#1d4ed8;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;letter-spacing:-.5px}
.topbar-title{color:#f1f5f9;font-size:14px;font-weight:500}
.topbar-sub{color:#64748b;font-size:12px}
.topbar-nav{display:flex;gap:4px}
.nav-btn{background:transparent;border:none;color:#94a3b8;padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-family:var(--sans);transition:.15s}
.nav-btn:hover,.nav-btn.active{background:#1e293b;color:#f1f5f9}

/* ── Layout ── */
.main{max-width:1400px;margin:0 auto;padding:24px}
.page{display:none}.page.active{display:block}

/* ── KPI Cards ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 20px}
.kpi-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500;margin-bottom:6px}
.kpi-value{font-size:22px;font-weight:700;line-height:1}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.green .kpi-value{color:var(--green)}
.kpi.yellow .kpi-value{color:var(--yellow)}
.kpi.orange .kpi-value{color:var(--orange)}
.kpi.red .kpi-value{color:var(--red)}

/* ── Filters ── */
.filters{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:20px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.filter-label{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.filter-group{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--bg);border:1px solid var(--border2);color:var(--muted);border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;transition:.15s;font-family:var(--sans)}
.chip:hover,.chip.active{border-color:var(--blue);background:var(--blue-light);color:var(--blue)}
.filter-search{border:1px solid var(--border2);border-radius:var(--radius);padding:6px 12px;font-size:13px;font-family:var(--sans);background:var(--bg);color:var(--text);outline:none;width:200px}
.filter-search:focus{border-color:var(--blue)}

/* ── Table ── */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:#f8fafc;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{background:#f1f5f9}
thead th:not(:first-child){text-align:right}
tbody tr{border-bottom:1px solid #f1f5f9;cursor:pointer;transition:.1s}
tbody tr:hover{background:#f8fafc}
tbody tr:last-child{border-bottom:none}
td{padding:10px 14px;white-space:nowrap}
td:not(:first-child){text-align:right;font-family:var(--mono);font-size:12px}
.td-name{font-weight:500;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.td-conta{color:var(--muted);font-family:var(--mono);font-size:11px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-Ótimo{background:var(--green-bg);color:var(--green)}
.badge-Bom{background:var(--yellow-bg);color:var(--yellow)}
.badge-Alerta{background:var(--orange-bg);color:var(--orange)}
.badge-Crítico{background:var(--red-bg);color:var(--red)}

/* ── Client Dashboard ── */
.client-selector{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:20px;display:flex;align-items:center;gap:16px}
.client-selector label{font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.client-select{border:1px solid var(--border2);border-radius:var(--radius);padding:8px 12px;font-size:14px;font-family:var(--sans);background:var(--bg);color:var(--text);outline:none;flex:1;max-width:400px}
.client-select:focus{border-color:var(--blue)}
.client-name-display{font-size:16px;font-weight:600;color:var(--text)}
.client-conta-display{font-size:12px;color:var(--muted);font-family:var(--mono)}

.ret-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.ret-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.ret-card h3{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.ret-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.ret-item label{font-size:10px;color:var(--muted);display:block;margin-bottom:2px}
.ret-item .val{font-size:15px;font-weight:600;font-family:var(--mono)}
.ret-item .val.green{color:var(--green)}
.ret-item .val.red{color:var(--red)}
.ret-item .val.yellow{color:var(--yellow)}

.class-grid{display:grid;gap:8px}
.class-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;display:grid;grid-template-columns:160px 1fr 80px 90px 80px 90px 80px;gap:8px;align-items:center}
.class-row:hover{border-color:var(--border2);background:#fafafa}
.class-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.class-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.class-bar-wrap{background:#f1f5f9;border-radius:4px;height:6px;overflow:hidden}
.class-bar{height:6px;border-radius:4px;transition:.3s}
.class-val{font-family:var(--mono);font-size:12px;text-align:right;color:var(--text)}
.class-val.muted{color:var(--muted)}
.class-label{font-size:10px;color:var(--muted);text-align:right}

.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-title{font-size:14px;font-weight:600}

/* ── Util ── */
.empty{text-align:center;padding:48px;color:var(--muted);font-size:14px}
.pct-pos{color:var(--green)}
.pct-neg{color:var(--red)}
.pct-neu{color:var(--muted)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">B3</div>
    <div>
      <div class="topbar-title">Blue3 · Cássia Duran</div>
      <div class="topbar-sub">Acompanhamento de Carteira</div>
    </div>
  </div>
  <div class="topbar-nav">
    <button class="nav-btn active" onclick="showPage('geral')">Dashboard Geral</button>
    <button class="nav-btn" onclick="showPage('cliente')">Por Cliente</button>
  </div>
</div>

<div class="main">

<!-- ═══════════ PAGE: GERAL ═══════════ -->
<div id="page-geral" class="page active">

  <div class="kpi-grid" id="kpi-grid"></div>

  <div class="filters">
    <span class="filter-label">Status Mês</span>
    <div class="filter-group" id="filter-status-mes">
      <button class="chip active" data-val="Todos">Todos</button>
      <button class="chip" data-val="Ótimo">🟢 Ótimo</button>
      <button class="chip" data-val="Bom">🟡 Bom</button>
      <button class="chip" data-val="Alerta">🟠 Alerta</button>
      <button class="chip" data-val="Crítico">🔴 Crítico</button>
    </div>
    <span class="filter-label" style="margin-left:8px">Status Ano</span>
    <div class="filter-group" id="filter-status-ano">
      <button class="chip active" data-val="Todos">Todos</button>
      <button class="chip" data-val="Ótimo">🟢 Ótimo</button>
      <button class="chip" data-val="Bom">🟡 Bom</button>
      <button class="chip" data-val="Alerta">🟠 Alerta</button>
      <button class="chip" data-val="Crítico">🔴 Crítico</button>
    </div>
    <input class="filter-search" id="search" placeholder="Buscar cliente..." oninput="applyFilters()">
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('nome')">Cliente</th>
          <th onclick="sortBy('net')">NET (R$)</th>
          <th onclick="sortBy('rb_mes')">Rent. Mês</th>
          <th onclick="sortBy('cdi_bruto_mes')">% CDI Mês</th>
          <th onclick="sortBy('rb_ano')">Rent. Ano</th>
          <th onclick="sortBy('cdi_bruto_ano')">% CDI Ano</th>
          <th onclick="sortBy('status_mes')">Status Mês</th>
          <th onclick="sortBy('status_ano')">Status Ano</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    <div id="table-empty" class="empty" style="display:none">Nenhum cliente encontrado</div>
  </div>
  <div id="table-count" style="font-size:12px;color:var(--muted);margin-top:8px;text-align:right"></div>
</div>

<!-- ═══════════ PAGE: CLIENTE ═══════════ -->
<div id="page-cliente" class="page">
  <div class="client-selector">
    <label>Cliente:</label>
    <select class="client-select" id="client-select" onchange="renderClient()">
      <option value="">Selecione um cliente...</option>
    </select>
    <div>
      <div class="client-name-display" id="client-name-display"></div>
      <div class="client-conta-display" id="client-conta-display"></div>
    </div>
  </div>
  <div id="client-content"></div>
</div>

</div><!-- /main -->

const STATUS_BG    = {'Ótimo':'#dcfce7','Bom':'#fef9c3','Alerta':'#ffedd5','Crítico':'#fee2e2'};
const CLASS_COLORS = ['#2E75B6','#375623','#7030A0','#833C00','#C00000','#595959','#0070C0','#00B050','#C55A11','#BF8F00'];

let filterMes = 'Todos', filterAno = 'Todos', sortCol = 'net', sortAsc = false;

function fmt_brl(v){return v>0?'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0}):'-'}
function fmt_pct(v){return v!=0?(v*100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%':'-'}
function fmt_cdi(v){return v!=0?(v*100).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0})+'%':'-'}
function pct_class(v){return v>0?'pct-pos':v<0?'pct-neg':'pct-neu'}

// ── KPIs ──────────────────────────────────────────────────────────────────────
function renderKPIs(filtered){
  const total_net = filtered.reduce((s,c)=>s+c.net,0);
  const dist = {};
  filtered.forEach(c=>{dist[c.status_mes]=(dist[c.status_mes]||0)+1});
  const kpis = [
    {label:'Clientes',value:filtered.length,sub:'na seleção',cls:''},
    {label:'NET Total',value:fmt_brl(total_net),sub:'carteira filtrada',cls:''},
    {label:'Ótimo',value:dist['Ótimo']||0,sub:'≥110% CDI mês',cls:'green'},
    {label:'Bom',value:dist['Bom']||0,sub:'100–110% CDI',cls:'yellow'},
    {label:'Alerta',value:dist['Alerta']||0,sub:'90–100% CDI',cls:'orange'},
    {label:'Crítico',value:dist['Crítico']||0,sub:'<90% CDI',cls:'red'},
  ];
  document.getElementById('kpi-grid').innerHTML = kpis.map(k=>
    `<div class="kpi ${k.cls}">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value">${k.value}</div>
      <div class="kpi-sub">${k.sub}</div>
    </div>`).join('');
}

// ── Table ─────────────────────────────────────────────────────────────────────
function applyFilters(){
  const search = document.getElementById('search').value.toLowerCase();
  let filtered = CLIENTS.filter(c=>{
    if(filterMes!=='Todos' && c.status_mes!==filterMes) return false;
    if(filterAno!=='Todos' && c.status_ano!==filterAno) return false;
    if(search && !c.nome.toLowerCase().includes(search) && !c.conta.includes(search)) return false;
    return true;
  });
  filtered.sort((a,b)=>{
    let av=a[sortCol],bv=b[sortCol];
    if(typeof av==='string') av=av.toLowerCase(),bv=bv.toLowerCase();
    return sortAsc?(av>bv?1:-1):(av<bv?1:-1);
  });
  renderKPIs(filtered);
  renderTable(filtered);
}

function renderTable(filtered){
  const tbody = document.getElementById('table-body');
  const empty = document.getElementById('table-empty');
  if(!filtered.length){tbody.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  tbody.innerHTML = filtered.map(c=>`
    <tr onclick="goClient('${c.conta}')">
      <td><div class="td-name">${c.nome}</div><div class="td-conta">${c.conta}</div></td>
      <td>${fmt_brl(c.net)}</td>
      <td class="${pct_class(c.rb_mes)}">${fmt_pct(c.rb_mes)}</td>
      <td>${fmt_cdi(c.cdi_bruto_mes)}</td>
      <td class="${pct_class(c.rb_ano)}">${fmt_pct(c.rb_ano)}</td>
      <td>${fmt_cdi(c.cdi_bruto_ano)}</td>
      <td><span class="badge badge-${c.status_mes}">${c.status_mes}</span></td>
      <td><span class="badge badge-${c.status_ano}">${c.status_ano}</span></td>
    </tr>`).join('');
  document.getElementById('table-count').textContent = filtered.length+' cliente(s) exibido(s)';
}

function sortBy(col){
  if(sortCol===col) sortAsc=!sortAsc; else {sortCol=col;sortAsc=false;}
  applyFilters();
}

// ── Filter chips ──────────────────────────────────────────────────────────────
document.getElementById('filter-status-mes').addEventListener('click',e=>{
  if(!e.target.classList.contains('chip')) return;
  document.querySelectorAll('#filter-status-mes .chip').forEach(c=>c.classList.remove('active'));
  e.target.classList.add('active');
  filterMes = e.target.dataset.val;
  applyFilters();
});
document.getElementById('filter-status-ano').addEventListener('click',e=>{
  if(!e.target.classList.contains('chip')) return;
  document.querySelectorAll('#filter-status-ano .chip').forEach(c=>c.classList.remove('active'));
  e.target.classList.add('active');
  filterAno = e.target.dataset.val;
  applyFilters();
});

// ── Client page ───────────────────────────────────────────────────────────────
function populateSelect(){
  const sel = document.getElementById('client-select');
  CLIENTS.forEach(c=>{
    const o=document.createElement('option');
    o.value=c.conta; o.textContent=c.nome+' ('+c.conta+')';
    sel.appendChild(o);
  });
}

function goClient(conta){
  showPage('cliente');
  document.getElementById('client-select').value=conta;
  renderClient();
}

function renderClient(){
  const conta = document.getElementById('client-select').value;
  const content = document.getElementById('client-content');
  if(!conta){content.innerHTML='<div class="empty">Selecione um cliente acima</div>';return;}
  const c = CLIENTS.find(x=>x.conta===conta);
  if(!c){content.innerHTML='<div class="empty">Cliente não encontrado</div>';return;}

  document.getElementById('client-name-display').textContent=c.nome;
  document.getElementById('client-conta-display').textContent='Conta '+c.conta+' · '+c.assessor+' · '+c.mes_ref;

  const retCard = (title, rb_m, cdi_brm, rl_m, cdi_lm, rb_a, cdi_bra, rl_a, cdi_la) => `
    <div class="ret-card">
      <h3>${title}</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div>
          <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:8px">MÊS</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px">
            ${retItem('Rent. Bruta',fmt_pct(rb_m),rb_m)}
            ${retItem('% CDI Bruto',fmt_cdi(cdi_brm),cdi_brm-1)}
            ${retItem('Rent. Líq.',fmt_pct(rl_m),rl_m)}
            ${retItem('% CDI Líq.',fmt_cdi(cdi_lm),cdi_lm-1)}
          </div>
        </div>
        <div>
          <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:8px">ANO</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px">
            ${retItem('Rent. Bruta',fmt_pct(rb_a),rb_a)}
            ${retItem('% CDI Bruto',fmt_cdi(cdi_bra),cdi_bra-1)}
            ${retItem('Rent. Líq.',fmt_pct(rl_a),rl_a)}
            ${retItem('% CDI Líq.',fmt_cdi(cdi_la),cdi_la-1)}
          </div>
        </div>
      </div>
    </div>`;

  const retItem = (label,val,sign) => `
    <div class="ret-item">
      <label>${label}</label>
      <div class="val ${sign>0?'green':sign<0?'red':''}">${val}</div>
    </div>`;

  const totalNet = c.net;
  const classRows = c.classes.map((cls,i)=>{
    if(!cls.vol) return '';
    const pct = totalNet>0?cls.vol/totalNet:0;
    return `<div class="class-row">
      <div class="class-name">
        <div class="class-dot" style="background:${CLASS_COLORS[i]}"></div>
        ${cls.cls}
      </div>
      <div>
        <div class="class-bar-wrap"><div class="class-bar" style="width:${Math.min(100,pct*100)}%;background:${CLASS_COLORS[i]}"></div></div>
        <div style="font-size:10px;color:var(--muted);margin-top:2px">${(pct*100).toFixed(1)}% da carteira</div>
      </div>
      <div class="class-val">${fmt_brl(cls.vol)}</div>
      <div class="class-val ${cls.rm>0?'pct-pos':cls.rm<0?'pct-neg':'muted'}">${fmt_pct(cls.rm)}</div>
      <div class="class-val muted"></div>
      <div class="class-val ${cls.ra>0?'pct-pos':cls.ra<0?'pct-neg':'muted'}">${fmt_pct(cls.ra)}</div>
      <div class="class-val muted"></div>
    </div>`;
  }).filter(Boolean).join('');

  content.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px">
      <div class="kpi"><div class="kpi-label">NET Conta Principal</div><div class="kpi-value" style="font-size:18px">${fmt_brl(c.net)}</div></div>
      <div class="kpi"><div class="kpi-label">Status Mês</div><div class="kpi-value" style="font-size:18px;color:${STATUS_COLOR[c.status_mes]}">${c.status_mes}</div><div class="kpi-sub">${fmt_cdi(c.cdi_bruto_mes)} do CDI</div></div>
      <div class="kpi"><div class="kpi-label">Status Ano</div><div class="kpi-value" style="font-size:18px;color:${STATUS_COLOR[c.status_ano]}">${c.status_ano}</div><div class="kpi-sub">${fmt_cdi(c.cdi_bruto_ano)} do CDI</div></div>
    </div>

    <div class="ret-grid" style="margin-bottom:20px">
      ${retCard('RETORNOS — CONTA PRINCIPAL',c.rb_mes,c.cdi_bruto_mes,c.rl_mes,c.cdi_liq_mes,c.rb_ano,c.cdi_bruto_ano,c.rl_ano,c.cdi_liq_ano)}
      <div class="ret-card" style="background:#f8fafc;border-style:dashed">
        <h3>RETORNOS — CARTEIRA ADM</h3>
        <div style="color:var(--muted);font-size:13px;padding:20px 0;text-align:center">
          📋 Dados da carteira ADM preenchidos manualmente<br>
          <span style="font-size:12px">Integração automática em breve</span>
        </div>
      </div>
    </div>

    <div class="section-header">
      <div class="section-title">Breakdown por Classe de Ativo</div>
    </div>
    <div style="display:grid;grid-template-columns:160px 1fr 80px 90px 80px 90px 80px;gap:8px;padding:0 16px;margin-bottom:6px">
      <div style="font-size:10px;color:var(--muted);font-weight:600">CLASSE</div>
      <div style="font-size:10px;color:var(--muted);font-weight:600">ALOCAÇÃO</div>
      <div style="font-size:10px;color:var(--muted);font-weight:600;text-align:right">VOLUME</div>
      <div style="font-size:10px;color:var(--muted);font-weight:600;text-align:right">RENT. MÊS</div>
      <div style="font-size:10px;color:var(--muted);font-weight:600;text-align:right">CRIT. MÊS</div>
      <div style="font-size:10px;color:var(--muted);font-weight:600;text-align:right">RENT. ANO</div>
      <div style="font-size:10px;color:var(--muted);font-weight:600;text-align:right">CRIT. ANO</div>
    </div>
    <div class="class-grid">${classRows || '<div class="empty">Sem dados de classe disponíveis</div>'}</div>
  `;
}

// ── Navigation ────────────────────────────────────────────────────────────────
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.querySelector(`[onclick="showPage('${id}')"]`).classList.add('active');
}

// ── Init ──────────────────────────────────────────────────────────────────────
populateSelect();
applyFilters();
</script>
</body>
</html>
